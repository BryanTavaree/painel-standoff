
name: Build NovaPanel APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaPanelAndroid.zip'
      - '.github/workflows/build.yml'
      - 'NovaPanelAndroid_v4.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -o NovaPanelAndroid_v4.zip -d project

      - name: Corrigir compatibilidade Java e Kotlin
        run: |
          FILE="project/app/build.gradle"
          if [ ! -f "$FILE" ]; then
            echo "Nao encontrei app/build.gradle dentro do ZIP"
            find project -maxdepth 4 -type f
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle")
          s = p.read_text()
          insert = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
          if "compileOptions" not in s:
              s = s.replace("android {", "android {\n" + insert, 1)
          elif "jvmTarget" not in s:
              s = s.replace("android {", "android {\n" + insert, 1)
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: project
        run: gradle assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaPanel-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
